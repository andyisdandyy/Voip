name: Release Rendezvous Server

on:
  push:
    branches:
      - master
    paths:
      - 'RendezvousServer/**'
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.5). Leave empty to auto-generate.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: gen
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list --count HEAD)
            echo "version=1.0.${COUNT}" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish linux-x64
        run: |
          dotnet publish RendezvousServer/RendezvousServer.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -o ./artifacts/linux-x64

      - name: Package
        run: |
          cd artifacts/linux-x64
          tar czf ../../RendezvousServer-linux-x64.tar.gz .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: relay-v${{ steps.gen.outputs.version }}
          name: Rendezvous Server v${{ steps.gen.outputs.version }}
          generate_release_notes: true
          files: RendezvousServer-linux-x64.tar.gz
