name: Release VoIP Client

on:
  push:
    tags:
      - 'client-v*'   # Push a tag like client-v1.1.0 to trigger a release

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: VoipClient.Electron
        run: npm install

      - name: Sync version from tag
        working-directory: VoipClient.Electron
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/client-v}"
          npm version "$TAG" --no-git-tag-version

      - name: Build & publish (Windows)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --x64 --publish always

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (for native module rebuilds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: VoipClient.Electron
        run: npm install

      - name: Sync version from tag
        working-directory: VoipClient.Electron
        run: |
          TAG="${GITHUB_REF#refs/tags/client-v}"
          npm version "$TAG" --no-git-tag-version

      - name: Build Vite
        working-directory: VoipClient.Electron
        run: npm run build

      - name: Publish (macOS x64)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64 --publish always

      - name: Publish (macOS arm64)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish always

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (for native module rebuilds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: VoipClient.Electron
        run: npm install

      - name: Sync version from tag
        working-directory: VoipClient.Electron
        run: |
          TAG="${GITHUB_REF#refs/tags/client-v}"
          npm version "$TAG" --no-git-tag-version

      - name: Build & publish (Linux)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --linux --x64 --publish always
