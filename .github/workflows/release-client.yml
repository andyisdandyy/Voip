name: Release VoIP Client

on:
  push:
    branches:
      - master
    paths:
      - 'VoipClient.Electron/**'
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.5). Leave empty to auto-generate.'
        required: false
        default: ''

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.gen.outputs.version }}
    steps:
      - name: Generate version
        id: gen
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.gen.outputs.version }}';
            const tag = `v${version}`;
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Echo ${tag}`,
              target_commitish: context.sha,
              draft: false,
              prerelease: false,
            });
            core.setOutput('id', release.data.id);

  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: VoipClient.Electron
        run: npm install

      - name: Install native addon dependencies
        working-directory: VoipClient.Electron/native/audio-loopback
        run: npm install

      - name: Build native addon
        working-directory: VoipClient.Electron
        run: npm run rebuild-native

      - name: Set version
        working-directory: VoipClient.Electron
        shell: bash
        run: npm version "${{ needs.create-release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build & publish (Windows)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --x64 --publish always

  build-mac-x64:
    needs: create-release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (for native module rebuilds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: VoipClient.Electron
        run: npm install

      - name: Set version
        working-directory: VoipClient.Electron
        run: npm version "${{ needs.create-release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build & publish (macOS x64)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build && npx electron-builder --mac --x64 --publish always

  build-mac-arm64:
    needs: create-release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (for native module rebuilds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: VoipClient.Electron
        run: npm install

      - name: Set version
        working-directory: VoipClient.Electron
        run: npm version "${{ needs.create-release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build & publish (macOS arm64)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build && npx electron-builder --mac --arm64 --publish always

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (for native module rebuilds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: VoipClient.Electron
        run: npm install

      - name: Set version
        working-directory: VoipClient.Electron
        run: npm version "${{ needs.create-release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build & publish (Linux)
        working-directory: VoipClient.Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --linux --x64 --publish always
