<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e0a;
      color: #22c55e;
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      height: 32px;
      background: #0d120d;
      display: flex;
      align-items: center;
      padding: 0 12px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(34, 197, 94, 0.15);
    }
    .titlebar span {
      font-size: 12px;
      font-weight: bold;
      opacity: 0.7;
    }
    .titlebar-controls {
      display: flex;
      align-items: center;
      margin-left: auto;
      -webkit-app-region: no-drag;
    }
    .titlebar-controls button {
      background: none;
      border: none;
      color: #15803d;
      width: 36px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .titlebar-controls button:hover {
      background: rgba(34, 197, 94, 0.15);
    }
    .titlebar-controls button.close:hover {
      background: #dc2626;
      color: #fff;
    }
    .titlebar-controls button svg {
      width: 14px;
      height: 14px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.2); border-radius: 3px; }
    .messages::-webkit-scrollbar-thumb:hover { background: rgba(34, 197, 94, 0.4); }
    .msg {
      padding: 6px 10px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
      font-size: 13px;
      line-height: 1.4;
    }
    .msg.self {
      align-self: flex-end;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .msg.other {
      align-self: flex-start;
      background: rgba(34, 197, 94, 0.08);
      color: #22c55e;
    }
    .msg .sender {
      font-size: 10px;
      font-weight: bold;
      opacity: 0.6;
      margin-bottom: 2px;
    }
    .msg .time {
      font-size: 9px;
      opacity: 0.4;
      margin-top: 2px;
      text-align: right;
    }
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid rgba(34, 197, 94, 0.15);
      background: #0d120d;
    }
    .input-bar input {
      flex: 1;
      background: #0a0e0a;
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      color: #22c55e;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-bar input:focus {
      border-color: rgba(34, 197, 94, 0.5);
    }
    .input-bar input::placeholder {
      color: #15803d;
      opacity: 0.5;
    }
    .input-bar button {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 8px;
      color: #22c55e;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .input-bar button:hover {
      background: rgba(34, 197, 94, 0.3);
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #15803d;
      font-size: 13px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <span id="title">Direct Message</span>
    <div class="titlebar-controls">
      <button onclick="window.dmAPI.minimize()" title="Minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button onclick="window.dmAPI.maximize()" title="Maximize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
      </button>
      <button class="close" onclick="window.dmAPI.close()" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty" id="empty">No messages yet — say hi!</div>
  </div>

  <div class="input-bar">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    let myName = '';
    let targetName = '';
    const messagesEl = document.getElementById('messages');
    const emptyEl = document.getElementById('empty');
    const inputEl = document.getElementById('input');

    window.dmAPI.getInfo().then(info => {
      myName = info.myName;
      targetName = info.targetName;
      document.getElementById('title').textContent = `DM — ${targetName}`;
      document.title = `DM — ${targetName}`;
      inputEl.placeholder = `Message ${targetName}...`;
    });

    function addMessage(sender, text, isSelf) {
      if (emptyEl.style.display !== 'none') emptyEl.style.display = 'none';
      const div = document.createElement('div');
      div.className = `msg ${isSelf ? 'self' : 'other'}`;
      const senderEl = document.createElement('div');
      senderEl.className = 'sender';
      senderEl.textContent = sender;
      const bodyEl = document.createElement('div');
      bodyEl.textContent = text;
      const timeEl = document.createElement('div');
      timeEl.className = 'time';
      timeEl.textContent = new Date().toLocaleTimeString();
      div.appendChild(senderEl);
      div.appendChild(bodyEl);
      div.appendChild(timeEl);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      window.dmAPI.sendMessage(text);
      addMessage(myName, text, true);
      inputEl.value = '';
      inputEl.focus();
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    window.dmAPI.onMessage((sender, text) => {
      addMessage(sender, text, false);
    });

    inputEl.focus();
  </script>
</body>
</html>
