<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e0a;
      color: #22c55e;
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      height: 32px;
      background: #0d120d;
      display: flex;
      align-items: center;
      padding: 0 12px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(34, 197, 94, 0.15);
    }
    .titlebar span {
      font-size: 12px;
      font-weight: bold;
      opacity: 0.7;
    }
    .video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      font-size: 12px;
      opacity: 0.8;
    }
    .ended {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #15803d;
      font-size: 14px;
    }
    .ended.visible { display: flex; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span id="title">Video</span>
  </div>
  <div class="video-container" style="position:relative;">
    <canvas id="canvas"></canvas>
    <div class="overlay"><span id="username"></span></div>
    <div class="ended" id="ended">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></svg>
      <span>Feed ended</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let decoder = null;
    let ts = 0;
    let gotKeyframe = false;

    window.popoutAPI.getInfo().then(info => {
      document.getElementById('title').textContent = info.username;
      document.getElementById('username').textContent = info.username;
      document.title = info.username;
    });

    window.popoutAPI.onVideoFrame((encodedData, isKeyFrame, codec) => {
      if (!isKeyFrame && !gotKeyframe) return;
      if (isKeyFrame) gotKeyframe = true;

      if (!decoder || decoder.state === 'closed') {
        const decoderCodec = codec === 'vp8' ? 'vp8' : 'avc1.640028';
        decoder = new VideoDecoder({
          output: (frame) => {
            canvas.width = frame.displayWidth;
            canvas.height = frame.displayHeight;
            ctx.drawImage(frame, 0, 0);
            frame.close();
          },
          error: (e) => {
            console.error('[PopoutDecoder]', e);
            gotKeyframe = false;
          },
        });
        decoder.configure({ codec: decoderCodec });
      }

      if (decoder.state !== 'configured' || decoder.decodeQueueSize > 5) return;

      ts += 33333;
      try {
        decoder.decode(new EncodedVideoChunk({
          type: isKeyFrame ? 'key' : 'delta',
          timestamp: ts,
          data: encodedData,
        }));
      } catch {
        gotKeyframe = false;
      }
    });

    window.popoutAPI.onClosed(() => {
      document.getElementById('ended').classList.add('visible');
      if (decoder) { try { decoder.close(); } catch {} decoder = null; }
    });
  </script>
</body>
</html>
